<style>
:root{--bg:#fff;--ink:#16232f;--ink-soft:#5b6b78;--line:#dfe4e8;--line-strong:#b9c2c9;--navy:#0b3d63;--navy-deep:#082c47;--principal:#1f7a5c;--interest:#a3402a;--panel:#f7f9fa;}
*{box-sizing:border-box} html{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hind Siliguri",Arial,sans-serif;min-height:100%;padding-bottom:70px}
.num{font-variant-numeric:tabular-nums}
header.app-head{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-bottom:2px solid var(--navy);padding-top:calc(14px + env(safe-area-inset-top,0px));background:#fff;flex-wrap:wrap}
.header-main{flex:1;min-width:200px}
.header-title-row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
header.app-head h1{margin:0;font-size:22px;color:var(--navy-deep);font-weight:800}
header.app-head .sub{font-size:13px;color:var(--ink-soft)}
.live-datetime{margin-top:10px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:8px 12px;display:inline-block}
.live-datetime div{font-size:14px;font-weight:800;color:#000;line-height:1.5}
.dev-inline{flex:none;width:148px;border-left:1px solid var(--line);padding-left:10px;font-size:11px;color:#97a3ad;line-height:1.7}
.viewport{overflow:hidden;position:relative}
.track{display:flex;width:200%;transition:transform .3s ease}
.track.show-page2{transform:translateX(-50%)}
.page{width:50%;flex:none}
#page1{padding:10px 12px;max-width:760px;margin:0 auto;display:flex;flex-direction:column;min-height:100dvh}
h2{font-size:16px;color:var(--navy-deep);margin:0 0 12px;font-weight:700;border-bottom:1px solid var(--line);padding-bottom:8px}
.form-row{display:flex;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 11px}
.fields-col{flex:1;display:flex;flex-direction:column;gap:9px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;color:var(--ink-soft);font-weight:600}
.field input{border:1px solid var(--line-strong);border-radius:5px;padding:8px 10px;font-size:15px;width:100%}
.summary-grid{display:grid;grid-template-columns:1fr;gap:6px;margin-top:12px}
.stat{border:1px solid var(--line);border-radius:8px;padding:7px 11px;background:#fff;display:flex;justify-content:space-between;align-items:center;gap:8px}
.stat .label{font-size:12.5px;color:var(--ink-soft);font-weight:600}
.stat .mid{font-size:12.5px;font-weight:800;color:#000;margin-left:6px}
.stat .value{font-size:17.5px;font-weight:800;color:var(--navy-deep)}
.stat .left{display:flex;align-items:center;gap:0}
#page2{display:flex;flex-direction:column;height:100vh;padding-bottom:70px}
.table-wrap{flex:1;overflow:auto;border-top:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:360px}
thead th{position:sticky;top:0;background:var(--navy);color:#fff;text-align:right;padding:9px 10px;font-size:11px}
thead th:first-child{text-align:left}
tbody td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right}
tbody td:first-child{text-align:left}
td.interest-col{color:var(--interest);cursor:pointer;font-weight:600}
td.sl-col{cursor:pointer}
tr.custom-selected{background:#e3f2fd !important}
tr.custom-selected td{background:#e3f2fd !important;font-weight:700}
tr.highlight-row{background:#fff3cd !important;font-weight:800}
 tr.highlight-row td{background:#fff3cd !important;font-weight:800;color:#000}
.paid-calc-bar{display:flex;gap:8px;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pc-field{display:flex;flex-direction:column;gap:4px;min-width:72px}
.pc-field label{font-size:11px;color:var(--ink-soft);font-weight:700}
.pc-field input{border:1px solid var(--line-strong);border-radius:6px;padding:7px 9px;font-size:14px;font-weight:700;width:92px}
.pc-result{min-width:160px;flex:1}
.vbox{border:1px dashed var(--line-strong);border-radius:6px;padding:7px 10px;background:var(--panel);font-size:13px;font-weight:800;color:var(--interest)}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid var(--line)}
.bottom-nav button{flex:1;border:none;background:#fff;padding:14px 6px;font-weight:700;cursor:pointer}
.bottom-nav button.active{background:var(--navy);color:#fff}
@media(min-width:900px){
#page1{max-width:1200px;width:100%;margin:0 auto;padding:20px 40px;min-height:auto}
#page1 > header.app-head{margin:-20px -40px 20px;padding:18px 40px;width:auto}
.summary-grid{grid-template-columns:repeat(3,1fr);max-width:1000px}
header.app-head{padding:18px 40px}
#page2{height:auto;min-height:100vh;padding-bottom:80px}
.table-wrap{max-width:1200px;margin:0 auto;width:100%}
.paid-calc-bar{max-width:1200px;margin:0 auto;width:100%}
.viewport{overflow:auto}
}
@media(min-width:900px) and (max-width:1200px){
#page1{padding:16px 24px}
#page1 > header.app-head{margin:-16px -24px 16px}
}
</style>
</head>

// Live Time Date Day - black bold
function updateLive(){ var n=new Date(); document.getElementById('liveTime').textContent=n.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true}); document.getElementById('liveDate').textContent=n.toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'}); document.getElementById('liveDay').textContent=n.toLocaleDateString('en-US',{weekday:'long'}); }
setInterval(updateLive,1000); updateLive();
// Offline support
if('serviceWorker' in navigator){ var code=`const C='emi-v2';self.addEventListener('install',e=>{e.waitUntil(caches.open(C).then(c=>c.addAll(['./'])))});self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)))})`; var b=new Blob([code],{type:'text/javascript'}); navigator.serviceWorker.register(URL.createObjectURL(b)).catch(()=>{}); }
// Core logic - FIXED CALCULATION
(function(){
var schedule=[]; window._customSelected=new Set();
function fmtTk(n){ if(!isFinite(n)) return "-"; var c=Math.ceil(n-1e-9); var s=Math.abs(c).toString(); var last3=s.slice(-3); var rest=s.slice(0,-3); if(rest) last3=","+last3; var withCommas=rest.replace(/\B(?=(\d{2})+(?!\d))/g, ",")+last3; return (c<0?"-":"")+withCommas; }
function read(){ var lac=parseFloat(document.getElementById("principal").value); var rate=parseFloat(document.getElementById("rate").value); var n=parseInt(document.getElementById("tenure").value,10); if(!(lac>0)||!(rate>=0)||!(n>0)) return null; return {P:lac*100000, rate:rate, n:n}; }
function emiCalc(P,r,n){ var rm=r/12/100; if(rm===0) return P/n; var f=Math.pow(1+rm,n); return P*rm*f/(f-1); }
function renderSum(emi,ti,tp){ document.getElementById("sumEmi").textContent=fmtTk(emi); document.getElementById("sumInterest").textContent=fmtTk(ti); document.getElementById("sumTotal").textContent=fmtTk(tp); }
function build(P,rate,n){ var rm=rate/12/100; var em=emiCalc(P,rate,n); var out=[],outst=P,ti=0; for(var i=1;i<=n;i++){ var intr=outst*rm; var pp=em-intr; if(i===n){pp=outst; outst=0;} else outst-=pp; ti+=intr; out.push({sl:i,interest:intr,principal:pp,outstanding:Math.max(outst,0)}); } return {emi:em,totalInt:ti,rows:out}; }
function auto(){ var inp=read(); if(!inp) return; var res=build(inp.P,inp.rate,inp.n); schedule=res.rows; renderSum(res.emi,res.totalInt,inp.P+res.totalInt); document.getElementById("summarySection").style.display=""; renderTable(); updateAuto(); }
function renderTable(){ if(!schedule.length){document.getElementById("tableHolder").innerHTML='';return;} var h='<div class="table-wrap"><table><thead><tr><th>SL No</th><th>Interest (Tk)</th><th>Principal (Tk)</th><th>Outstanding (Tk)</th></tr></thead><tbody id="scheduleBody">'; schedule.forEach(function(r,i){ var cls=window._customSelected.has(i)?' class="custom-selected"':''; h+='<tr data-row="'+i+'"'+cls+'><td class="sl-col" data-row="'+i+'">'+r.sl+'</td><td class="num interest-col" data-row="'+i+'">'+fmtTk(r.interest)+'</td><td class="num">'+fmtTk(r.principal)+'</td><td class="num">'+fmtTk(r.outstanding)+'</td></tr>'; }); h+='</tbody></table></div>'; document.getElementById("tableHolder").innerHTML=h; bind(); }
function updateAuto(){ var pi=document.getElementById("paidEmiInput"), fi=document.getElementById("fromEmiInput"), rb=document.getElementById("last12InterestResult"); var p=parseInt(pi.value,10); if(!(p>0)||!schedule.length){ if(window._customSelected.size>0){updateCustom();return;} fi.value=""; rb.textContent="-"; return; } if(p>schedule.length) p=schedule.length; var f=Math.max(1,p-11); fi.value=f; var s=0; for(var i=f-1;i<p;i++) if(schedule[i]) s+=schedule[i].interest; rb.textContent="Tk "+fmtTk(s)+" ("+f+" to "+p+")"; window._lastTo=p; highlight(p); }
function updateCustom(){ var rb=document.getElementById("last12InterestResult"), fi=document.getElementById("fromEmiInput"), pi=document.getElementById("paidEmiInput"); if(!window._customSelected.size){rb.textContent="-";return;} var sum=0,list=[]; window._customSelected.forEach(function(i){ if(schedule[i]){sum+=schedule[i].interest; list.push(i+1);}}); list.sort((a,b)=>a-b); rb.textContent="Tk "+fmtTk(sum)+" (Selected: "+list.join(",")+")"; fi.value=list[0]||""; pi.value=list[list.length-1]||""; }
function highlight(to){ if(window._customSelected.size) return; var from=Math.max(1,to-11); var tbody=document.getElementById("scheduleBody"); if(!tbody) return; tbody.querySelectorAll("tr").forEach(function(tr){ var sl=parseInt(tr.dataset.row,10)+1; if(sl>=from&&sl<=to) tr.classList.add("highlight-row"); else tr.classList.remove("highlight-row"); }); }
function bind(){ var tbody=document.getElementById("scheduleBody"); if(!tbody||tbody.dataset.bound) return; tbody.dataset.bound="1"; tbody.addEventListener("click",function(e){ var sl=e.target.closest(".sl-col"), it=e.target.closest(".interest-col"); if(sl||it){ var rowEl = sl || it; var i=parseInt(rowEl.dataset.row,10); var pi=document.getElementById("paidEmiInput"), fi=document.getElementById("fromEmiInput"), rb=document.getElementById("last12InterestResult"); var clickedSL = i+1; var currentSL = parseInt(pi.value,10);
 if(window._customSelected.size===0 && currentSL===clickedSL && pi.value!==""){ pi.value=""; fi.value=""; rb.textContent="-"; renderTable(); return; }
 window._customSelected.clear(); pi.value=clickedSL; renderTable(); updateAuto(); } }); }
function go2(){document.getElementById("track").classList.add("show-page2"); document.getElementById("navHome").classList.remove("active"); document.getElementById("navAmor").classList.add("active"); auto();}
function go1(){document.getElementById("track").classList.remove("show-page2"); document.getElementById("navAmor").classList.remove("active"); document.getElementById("navHome").classList.add("active");}
document.addEventListener("DOMContentLoaded",function(){ ["principal","rate","tenure"].forEach(function(id){ var el=document.getElementById(id); el.addEventListener("input",auto); }); document.getElementById("navHome").addEventListener("click",go1); document.getElementById("navAmor").addEventListener("click",go2); document.getElementById("paidEmiInput").addEventListener("input",function(){ window._customSelected.clear(); updateAuto(); }); });
})();
</script>
